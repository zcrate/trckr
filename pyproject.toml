[project]
name = "trckr"
version = "0.1.0"
description = "Minimal event-driven time and count tracker"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
trckr = "src.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
